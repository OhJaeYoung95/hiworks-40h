# main 브랜치에 올리면 테스트 → 스크립트 빌드 → GitHub Pages 배포까지 자동으로 진행한다.
# 테스트가 하나라도 실패하면 배포하지 않는다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 테스트
        run: npm test

      - name: 스크립트 빌드
        run: node scripts/build-userscript.js
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
