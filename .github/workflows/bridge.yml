# 옛 주소(…/hiworks-40h/)를 지키는 다리.
# 이미 설치한 스크립트는 옛 주소에서 업데이트를 확인한다. 여기서 새 주소(…/doodling/)의 최신 스크립트를
# 그대로 내주면, 설치본은 새 업데이트 주소가 적힌 스크립트를 받아 그다음부터 새 주소에서 업데이트한다.
# 새 버전이 나와도 따라가도록 매일 한 번 다시 받아 둔다.
name: 다리

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 새 주소의 최신 스크립트 받기
        run: |
          curl -fsSL https://ohjaeyoung95.github.io/doodling/hiworks-40h.user.js -o site/hiworks-40h.user.js
          # 새 주소로 업데이트하는 스크립트가 맞는지 확인한다. 아니면 배포하지 않는다 (이전 다리가 그대로 남는다).
          grep -q '^// @updateURL    https://ohjaeyoung95.github.io/doodling/hiworks-40h.user.js$' site/hiworks-40h.user.js
          grep -q '^// @namespace    https://github.com/OhJaeYoung95/hiworks-40h$' site/hiworks-40h.user.js
          grep -m1 '@version' site/hiworks-40h.user.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
