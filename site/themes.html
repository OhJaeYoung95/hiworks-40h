<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 테마 만들기</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #2b2723; --muted: #756d64;
    --line: #e2ded6; --accent: #6b5bd6; --accent-text: #ffffff; --ok: #2f8a4c; --warn: #a86a00; --err: #c23b32;
    --thumb: #fbfaf7; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b1a; --surface: #262523; --surface-2: #302e2b; --text: #ece8e2; --muted: #a59d93;
      --line: #3b3935; --accent: #9d90f0; --accent-text: #1c1b1a; --ok: #6cc58a; --warn: #e0a84a; --err: #f07b72;
      --thumb: #22211f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b1a; --surface: #262523; --surface-2: #302e2b; --text: #ece8e2; --muted: #a59d93;
    --line: #3b3935; --accent: #9d90f0; --accent-text: #1c1b1a; --ok: #6cc58a; --warn: #e0a84a; --err: #f07b72;
    --thumb: #22211f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding-bottom: 200px; background: var(--bg); color: var(--text); font: 14px/1.5 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); }
  button, select, input, textarea { font: inherit; color: var(--text); }
  button, select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  input[type="text"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 100%; min-width: 0; }
  textarea { font-family: Consolas, monospace; font-size: 12px; resize: vertical; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) 300px; }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  section h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  section h2 small { color: var(--muted); font-weight: 400; }
  .col { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }

  /* 캐릭터 목록 */
  #catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--surface-2); display: grid; gap: 4px; justify-items: center; text-align: center; }
  .card .name { font-weight: 600; font-size: 13px; }
  .card .id { color: var(--muted); font-size: 11px; }
  .card button { padding: 3px 10px; font-size: 12px; width: 100%; }
  .thumb { background: var(--thumb); border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .thumb > div { background-repeat: no-repeat; background-position: center bottom; background-size: contain; }

  /* 테마 편집 */
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field > span { color: var(--muted); font-size: 13px; }
  #cast { display: grid; gap: 8px; }
  .member { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
  .member .edit { display: grid; gap: 6px; min-width: 0; }
  .member .line { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .member input[type="range"] { flex: 1; min-width: 80px; }
  .member .tools { display: grid; gap: 4px; }
  .member .tools button { padding: 2px 8px; font-size: 12px; }
  .empty { color: var(--muted); padding: 20px 8px; text-align: center; }
  .moods { display: flex; flex-wrap: wrap; gap: 6px; }
  .moods button { font-size: 13px; padding: 5px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  code { font-family: Consolas, monospace; font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
  ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>캐릭터 테마 만들기</h1>
  <p>캐릭터를 골라 이름을 붙이고, 코드로 동료와 나눠 쓰세요. 화면 아래에서 실제처럼 미리 움직입니다. · <a href="studio.html">캐릭터 팩 작업실</a></p>
</header>

<main>
  <div class="col">
    <section>
      <h2>캐릭터 <small id="catalogCount"></small></h2>
      <div id="catalog"></div>
      <p class="hint">새 캐릭터 그림은 <a href="studio.html">캐릭터 팩</a>으로 저장소에 올리면 여기에 나타납니다.</p>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>테마 <small id="castCount"></small></h2>
      <label class="field"><span>테마 이름</span><input type="text" id="themeName" maxlength="20" placeholder="예: 조용한 사무실"></label>
      <div id="cast"></div>
      <div class="row">
        <select id="loadSelect" aria-label="있는 테마 불러오기"><option value="">있는 테마 불러오기…</option></select>
        <button id="clear">모두 빼기</button>
      </div>
    </section>
    <section>
      <h2>미리 보기 <small>화면 아래</small></h2>
      <div class="moods" id="moods">
        <button data-mood="normal" aria-pressed="true">평소</button>
        <button data-mood="hurry">퇴근 1시간 전</button>
        <button data-mood="celebrate">40시간 축하</button>
        <button data-mood="rest">퇴근 후</button>
      </div>
      <div class="msg" id="previewMsg"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>공유 코드</h2>
      <textarea id="code" rows="4" readonly aria-label="공유 코드"></textarea>
      <div class="row"><button class="primary" id="copyCode">코드 복사</button></div>
      <p class="hint">하이웍스 패널의 🎨 → <b>＋ 코드로 추가</b>에 붙여 넣으면 그 사람 목록에 이 이름으로 추가됩니다.</p>
    </section>
    <section>
      <h2>코드 불러오기</h2>
      <textarea id="importCode" rows="3" placeholder="HW40T1.…" aria-label="불러올 코드"></textarea>
      <div class="row"><button id="importBtn">불러와서 고치기</button></div>
      <div class="msg" id="importMsg"></div>
    </section>
    <section>
      <h2>공용 테마로 올리기</h2>
      <p class="hint" style="margin-top:0">모두의 🎨 목록에 기본으로 나오게 하려면 저장소에 <code id="sharedPath">themes/my-theme.json</code> 파일로 이 내용을 넣고 푸시하세요.</p>
      <label class="field" style="margin-top:8px"><span>파일 이름 (영문 소문자·숫자·-)</span><input type="text" id="fileId" value="my-theme" maxlength="40"></label>
      <textarea id="json" rows="6" readonly aria-label="테마 JSON"></textarea>
      <div class="row"><button id="copyJson">JSON 복사</button></div>
    </section>
  </div>
</main>

<script>
  // 하이웍스 화면 대신 미리 보기용 상황을 엔진에 준다.
  window.HW40 = {
    mood: 'normal',
    mascotMood() { return window.HW40.mood; },
    formatDuration: () => '3시간 12분',
    latest: null,
  };
</script>
<script src="studio/builtin-characters.js"></script>
<script src="studio/sprite.js"></script>
<script src="studio/themes.js"></script>
<script src="studio/packs-data.js"></script>
<script src="studio/mascot.js"></script>
<script>
(function () {
  const T = window.HW40_THEMES;
  const engine = window.HW40.themes;
  const ART_CSS = window.HW40_BUILTINS.artCss;
  const $ = (id) => document.getElementById(id);
  const catalog = engine.catalog();
  const byId = new Map(catalog.map((c) => [c.id, c]));
  const defaultSize = (c) => (c.pack ? c.pack.size : 64);

  let draft = { name: '', cast: [] };

  // ---------- 미리보기 그림 ----------
  function thumb(c, px) {
    const box = document.createElement('div');
    box.className = 'thumb';
    box.style.width = box.style.height = `${px}px`;
    if (c.pack) {
      const idle = c.pack.animations.idle;
      const img = document.createElement('div');
      img.style.width = img.style.height = `${px}px`;
      if (idle.sheet) {
        img.style.backgroundImage = `url("${idle.sheet}")`;
        img.style.backgroundSize = `${idle.count * 100}% 100%`;
        img.style.backgroundPosition = '0 0';
      } else {
        img.style.backgroundImage = `url("${idle.frames[0]}")`;
      }
      box.appendChild(img);
    } else {
      const shadow = box.attachShadow({ mode: 'open' });
      shadow.innerHTML = `<style>${ART_CSS} svg{display:block;overflow:visible}</style><div class="idle"><svg viewBox="0 0 64 64" width="${px}" height="${px}">${c.art}</svg></div>`;
    }
    return box;
  }

  // ---------- 화면 ----------
  function renderCatalog() {
    $('catalogCount').textContent = `${catalog.length}종`;
    $('catalog').replaceChildren(
      ...catalog.map((c) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.appendChild(thumb(c, 64));
        card.insertAdjacentHTML('beforeend', `<div class="name"></div><div class="id"></div>`);
        card.querySelector('.name').textContent = c.label + (c.chaser ? ' 👾' : '');
        card.querySelector('.id').textContent = c.id + (c.pack ? ' · 팩' : ' · 기본');
        const add = document.createElement('button');
        add.textContent = '＋ 넣기';
        add.disabled = draft.cast.length >= T.MAX_CAST;
        add.onclick = () => {
          draft.cast.push({ id: c.id });
          changed();
        };
        card.appendChild(add);
        return card;
      })
    );
  }

  function renderCast() {
    $('castCount').textContent = `${draft.cast.length} / ${T.MAX_CAST}명`;
    const box = $('cast');
    if (!draft.cast.length) {
      box.innerHTML = '<div class="empty">왼쪽에서 캐릭터를 넣어 주세요.</div>';
      return;
    }
    box.replaceChildren(
      ...draft.cast.map((m, i) => {
        const c = byId.get(m.id);
        const row = document.createElement('div');
        row.className = 'member';
        row.appendChild(thumb(c, 56));
        const edit = document.createElement('div');
        edit.className = 'edit';
        const size = m.size || defaultSize(c);
        edit.innerHTML = `
          <input type="text" maxlength="${T.LABEL_MAX}" aria-label="이름">
          <div class="line"><span>크기</span><input type="range" min="${T.SIZE_MIN}" max="${T.SIZE_MAX}" step="4" value="${size}" aria-label="크기"><span class="px">${size}px</span></div>`;
        const name = edit.querySelector('input[type="text"]');
        name.value = m.name || '';
        name.placeholder = `${c.label} (이름 바꾸기)`;
        name.oninput = () => {
          m.name = name.value.trim() || undefined;
          changed(false);
        };
        const range = edit.querySelector('input[type="range"]');
        range.oninput = () => {
          const v = Number(range.value);
          m.size = v === defaultSize(c) ? undefined : v;
          edit.querySelector('.px').textContent = `${v}px`;
          changed(false);
        };
        row.appendChild(edit);
        const tools = document.createElement('div');
        tools.className = 'tools';
        const tool = (label, title, fn, disabled) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.title = title;
          b.disabled = disabled;
          b.onclick = fn;
          tools.appendChild(b);
        };
        const move = (d) => () => {
          [draft.cast[i], draft.cast[i + d]] = [draft.cast[i + d], draft.cast[i]];
          changed();
        };
        tool('▲', '앞으로', move(-1), i === 0);
        tool('▼', '뒤로', move(1), i === draft.cast.length - 1);
        tool('✕', '빼기', () => {
          draft.cast.splice(i, 1);
          changed();
        }, false);
        row.appendChild(tools);
        return row;
      })
    );
  }

  function cleanDraft() {
    return {
      name: draft.name,
      cast: draft.cast.map((m) => {
        const out = { id: m.id };
        if (m.name) out.name = m.name;
        if (m.size) out.size = m.size;
        return out;
      }),
    };
  }

  let previewTimer = 0;
  function changed(rerender = true) {
    if (rerender) {
      renderCast();
      renderCatalog();
    }
    const raw = cleanDraft();
    if (!raw.cast.length) {
      $('code').value = '';
      $('json').value = '';
      $('previewMsg').textContent = '캐릭터를 넣으면 화면 아래에 나옵니다.';
      return;
    }
    const { theme } = T.normalizeTheme(raw);
    $('code').value = T.encodeTheme(theme);
    $('json').value = JSON.stringify(theme, null, 2);
    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => {
      engine.preview(theme);
      $('previewMsg').textContent = '';
    }, 250);
  }

  function load(theme) {
    draft = { name: theme.name === '기본' ? '' : theme.name, cast: theme.cast.filter((m) => byId.has(m.id)).map((m) => ({ ...m })) };
    $('themeName').value = draft.name;
    changed();
  }

  // ---------- 입력 ----------
  $('themeName').oninput = () => {
    draft.name = $('themeName').value;
    changed(false);
  };
  $('clear').onclick = () => {
    draft.cast = [];
    changed();
  };
  for (const t of engine.list().filter((t) => t.source !== 'mine')) {
    const o = document.createElement('option');
    o.value = t.key;
    o.textContent = t.source === 'shared' ? `${t.name} (공용)` : t.name;
    $('loadSelect').appendChild(o);
  }
  $('loadSelect').onchange = () => {
    const t = engine.list().find((x) => x.key === $('loadSelect').value);
    if (t) load(t);
    $('loadSelect').value = '';
  };

  const copy = async (text, button) => {
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      const old = button.textContent;
      button.textContent = '복사했어요';
      setTimeout(() => { button.textContent = old; }, 1500);
    } catch {
      window.prompt('복사해 주세요.', text);
    }
  };
  $('copyCode').onclick = () => copy($('code').value, $('copyCode'));
  $('copyJson').onclick = () => copy($('json').value, $('copyJson'));
  $('fileId').oninput = () => {
    const id = $('fileId').value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/^-+/, '') || 'my-theme';
    $('sharedPath').textContent = `themes/${id}.json`;
  };

  $('importBtn').onclick = () => {
    const msg = $('importMsg');
    try {
      const { theme, warnings } = T.normalizeTheme(T.decodeTheme($('importCode').value), new Set(byId.keys()));
      load(theme);
      msg.className = warnings.length ? 'msg warn' : 'msg ok';
      msg.textContent = `"${theme.name}"을 불러왔어요.${warnings.length ? ` ${warnings.join(' ')}` : ''}`;
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = e.message;
    }
  };

  for (const b of document.querySelectorAll('#moods button')) {
    b.onclick = () => {
      window.HW40.mood = b.dataset.mood;
      for (const x of document.querySelectorAll('#moods button')) x.setAttribute('aria-pressed', String(x === b));
    };
  }

  // 처음에는 기본 테마를 불러온다.
  load(engine.list()[0]);
})();
</script>
</body>
</html>
